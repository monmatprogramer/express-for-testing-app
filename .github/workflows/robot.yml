name: Node.js Test Robot

# 1. It works when robo is called then push code to main.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# 2. Assign task to robot
jobs:
  check-my-code:
    # Rent a free Ubuntu Linux server from GitHub
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      # Step A: Copy your code into the Linux server 
      - name: Get code from GitHub
        uses: actions/checkout@v5

      # Step B: Install Node.js version 20 on the Linux server 
      - name: Install Node.js
        uses: actions/setup-node@v5
        with: 
          node-version: '26'
          cache: 'npm'

      - name: Install project packages
        run: npm install

      - name: Generate Prisma Client
        run: |
          npx prisma contract emit
          npx prisma db update
        env: 
          DIRECT_URL: "postgresql://admin:password123@localhost:5432/test_db"
      
      - name: Check code for errors
        run: npm run build

      

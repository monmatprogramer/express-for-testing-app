# Perform one jop
services:
  # The app from lesson 1.
  api:
    build: .
    ports:
      - "4000:4000"
    env_file:
      - .env
    # Use the same local database password as the db service.
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/express_test
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Apply the Prisma schema before starting the API.
  migrate:
    build:
      context: .
      target: build
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/express_test
    command: ["npm", "run", "prisma:push"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: express_test
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d express_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
